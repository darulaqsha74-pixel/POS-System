<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LumiMart</title>
    <link rel="stylesheet" href="Product.css">
</head>

<body>
    <div class="MainDiv">
        <div class="SideBar">

            <div class="Heading">
                🛒<br>
                LUMI MART
            </div>

            <div class="listitem">
                <img width="20px" height="20px" src="https://img.icons8.com/fluency-systems-filled/50/home.png"
                    alt="Home" /><a href="HomePage.html"> Home </a>
            </div>

            <div class="listitem">
                <img width="20" height="20" src="https://img.icons8.com/fluency-systems-filled/48/product.png"
                    alt="product" /><a href="Product.html"> Product </a>
            </div>

            <div class="listitem">
                <img width="20" height="20" src="https://img.icons8.com/fluency-systems-filled/48/billing-machine.png"
                    alt="billing-machine" /><a href="Billing.html"> Billing </a>
            </div>

        </div>

        <div class="ImageHome">
            <section class="hero">
                <div class="hero-content">

                   <div class="ProductPanel">
                         <div class="headingPanel">
                            <h1><img width="30" height="30" src="https://img.icons8.com/fluency-systems-filled/48/product.png"
                            alt="product" />
                            Products</h1>
                            <P>Manage your product details here</P>

                            <div class="search">
                                <input type="text" placeholder="Search products...">
                                <a href="Billing.html" class="add-btn">ADD PRODUCT  </a>
                            </div>
                            
                         </div>

                         <div class="itemPanel">

                            <div class="box">
                                <img src="Assest/shirtImage.jpeg" alt="shirt" height="200px" width="200px">
                                <h4>T-Shirt</h4>
                                <h5>Rs.2500</h5>
                                <button>Add </button>
                            </div>

                            <div class="box">
                                <img src="Assest/ShoeImage.jpeg" alt="Shoe" height="200px" width="200px">
                                <h4>Shoe</h4>
                                <h5>Rs.3999</h5>
                                <button>Add </button>
                            </div>

                            <div class="box">
                                <img src="Assest/WatchImage.jpeg" alt="Watch" height="200px" width="200px">
                                 <h4>Watch</h4>
                                <h5>Rs.2490</h5>
                                <button>Add </button>
                            </div>

                            <div class="box">
                                <img src="Assest/BagImage.jpeg" alt="Bag" height="200px" width="200px">
                                 <h4>Hand Bag</h4>
                                <h5>Rs.1999</h5>
                                <button>Add</button>
                            </div>

                            <div class="box">
                                <img src="Assest/CapImage.jpeg" alt="Cap" height="200px" width="200px">
                                 <h4>Cap</h4>
                                <h5>Rs.499</h5>
                                <button>Add</button>
                            </div>

                            <div class="box">
                                <img src="Assest/GlassImage.jpeg" alt="Glass" height="200px" width="200px">
                                <h4>Sunglasses</h4>
                                <h5>Rs.1499</h5>
                                <button>Add</button>
                            </div>

                        </div>

                   </div>


                   <div class="BillingPanel">
                        <h1>Billing</h1>
                   </div>

                </div>
            </section>

        </div>

    </div>

</body>

</html>
